[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "balajidani-ocrconf"
version = "0.1.0"
description = "按置信度阈值标出低可信区域，并提示需要人工确认"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "balajidani" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://balajidani.github.io"
Repository = "https://github.com/balajidani/ocrconf"
Issues = "https://github.com/balajidani/ocrconf/issues"

[project.scripts]
ocrconf = "ocrconf:main"

[tool.setuptools]
py-modules = ["ocrconf"]
